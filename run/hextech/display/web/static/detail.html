<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hextech 极地枢纽 - 英雄海克斯矩阵</title>
    <link rel="preconnect" href="https://ddragon.leagueoflegends.com" crossorigin>
    <link rel="preconnect" href="https://raw.communitydragon.org" crossorigin>
    <link rel="preload" href="/static/css/hextech-theme.css" as="style">
    <link rel="preload" href="/static/css/tailwind-compiled.css" as="style">
    <link rel="stylesheet" href="/static/css/hextech-theme.css">
    <link rel="stylesheet" href="/static/css/tailwind-compiled.css">
</head>

<body class="detail-page-shell">

    <nav class="detail-topbar detail-frame flex justify-between items-center">
        <a href="index.html" class="detail-back-link flex items-center space-x-2">
            <span class="text-xl" aria-hidden="true">&larr;</span> <span>返回大盘风云榜</span>
        </a>
        <div id="wsStatus" class="flex items-center space-x-2 text-xs">
            <span class="w-2 h-2 bg-gray-500 rounded-full"></span>
            <span class="text-gray-400">WS 待连接</span>
        </div>
    </nav>

    <main class="detail-frame">
        <header class="detail-header-panel glass-panel rounded-2xl flex items-center relative overflow-hidden"
            id="mainHeader">
            <div id="headerBg" class="absolute right-0 top-0 bottom-0 w-1/2 opacity-20 bg-cover bg-left"></div>
            <img id="heroAvatar" src=""
                class="rounded-xl hx-hero-avatar relative z-10 bg-gray-900 object-cover">

            <div class="detail-hero-copy relative z-10">
                <div class="flex items-center space-x-3 mb-1">
                    <h1 id="heroName" class="detail-title font-black text-white">加载中...</h1>
                </div>
                <div class="detail-stat-row flex text-sm mt-2">
                    <p><span class="text-gray-400">真实胜率:</span> <span id="heroWR"
                            class="text-green-400 font-bold">-</span></p>
                    <p><span class="text-gray-400">全服出场率:</span> <span id="heroPR"
                            class="text-white font-bold">-</span></p>
                </div>
            </div>
        </header>

        <section class="detail-control-panel glass-panel rounded-2xl">
            <div class="detail-control-bar flex flex-wrap items-center border-b border-gray-800">
                <div class="detail-mode-group">
                    <button id="btn-comprehensive" onclick="setDisplayMode('comprehensive')"
                        class="mode-btn hx-tab-active px-4 py-2 rounded-lg text-sm">综合推荐</button>
                    <button id="btn-winrate" onclick="setDisplayMode('winrate_only')"
                        class="mode-btn hx-tab-idle px-4 py-2 rounded-lg font-medium text-sm">纯胜率</button>
                </div>
                <div class="flex-1"></div>
                <div class="detail-tier-group">
                    <button id="tab-all" onclick="switchView('all')"
                        class="tab-btn hx-tab-active px-5 py-2 rounded-lg">全部海克斯</button>
                    <button id="tab-Prismatic" onclick="switchView('Prismatic')"
                        class="tab-btn hx-tab-idle px-5 py-2 rounded-lg font-medium">棱彩</button>
                    <button id="tab-Gold" onclick="switchView('Gold')"
                        class="tab-btn hx-tab-idle px-5 py-2 rounded-lg font-medium">黄金</button>
                    <button id="tab-Silver" onclick="switchView('Silver')"
                        class="tab-btn hx-tab-idle px-5 py-2 rounded-lg font-medium">白银</button>
                </div>
            </div>

            <div id="loadingSpinner" class="hidden flex flex-col items-center justify-center py-20">
                <div class="hextech-loader-container mb-6">
                    <div class="hextech-crystal-loader">
                        <div class="crystal-core"></div>
                        <div class="orbit-ring orbit-1"></div>
                        <div class="orbit-ring orbit-2"></div>
                    </div>
                </div>
                <div class="text-sky-300 font-bold tracking-[0.24em] uppercase text-sm animate-pulse">加载海克斯数据中...</div>
            </div>

            <!-- 骨架屏：替代水晶 Loading，提供 6 张占位卡片更贴近真实内容轮廓 -->
            <div id="skeletonContainer">
                <div class="skeleton-card"></div>
                <div class="skeleton-card"></div>
                <div class="skeleton-card"></div>
                <div class="skeleton-card"></div>
                <div class="skeleton-card"></div>
                <div class="skeleton-card"></div>
            </div>

            <div id="noDataTip" class="hidden text-center py-20">
                <div class="text-gray-500 text-xl font-bold">暂无有效海克斯战报</div>
                <div class="text-gray-600 text-sm mt-2">该阶级可能样本过少或被系统过滤</div>
            </div>

            <div id="dataContainer" class="flex hidden">
                <div class="detail-left-pane">
                    <div id="compList" class="flex flex-col gap-4 scroll-container"
                        style="overflow-y: auto; padding-right: 8px; overflow-anchor: none;"></div>
                </div>

                <div class="detail-right-pane">
                    <div id="synergyArticleScroll"
                        class="flex flex-col gap-4 overflow-y-auto scroll-container"
                        style="padding-right: 8px; overflow-anchor: none;">
                        <div class="glass-panel rounded-xl p-4">
                            <div class="text-sm text-gray-400 text-center">选择左侧海克斯查看联动文章</div>
                        </div>
                    </div>
                </div>
            </div>
        </section>

    </main>

    <script defer src="/static/js/detail.js"></script>
</body>

</html>
