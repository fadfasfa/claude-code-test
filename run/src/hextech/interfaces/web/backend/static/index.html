<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hextech 极地枢纽 - 全英雄 T 度风云榜</title>
    <link rel="preconnect" href="https://ddragon.leagueoflegends.com" crossorigin>
    <link rel="preconnect" href="https://raw.communitydragon.org" crossorigin>
    <link rel="preload" href="/static/css/hextech-theme.css" as="style">
    <link rel="preload" href="/static/css/tailwind-compiled.css" as="style">
    <link rel="stylesheet" href="/static/css/hextech-theme.css">
    <link rel="stylesheet" href="/static/css/tailwind-compiled.css">
</head>
<body class="hx-page-shell hx-index-body min-h-screen">

    <header class="hero-dashboard-header hx-index-frame mb-4 flex flex-col items-center justify-center space-y-3 mt-2">
        <div class="flex items-center space-x-3">
            <div class="w-2.5 h-2.5 rounded-full bg-hx-win animate-pulse"></div>
            <span class="font-black text-2xl tracking-hx text-hx-text-strong">HEXTECH <span class="text-hx-art-gold">NEXUS</span></span>
        </div>

        <div class="relative w-full max-w-2xl group">
            <div class="absolute -inset-[1px] rounded-full border border-white/5 opacity-80 pointer-events-none"></div>
            <input type="text" id="searchInput" placeholder="搜英雄看海克斯... (支持拼音如：ys / 外号如：快乐风男)"
                   class="search-input relative w-full text-lg rounded-full py-4 px-6 pr-32 placeholder-slate-500 transition-all">
            <span class="hx-search-label absolute right-20 top-4 text-sm tracking-hx text-slate-400 uppercase">搜索</span>
            <kbd class="hx-search-hint absolute right-6 top-4" title="按 / 或 Ctrl+K 聚焦搜索">/</kbd>
        </div>
        <div id="wsStatus" class="flex items-center space-x-2 text-xs">
            <span class="w-2 h-2 bg-slate-500 rounded-full"></span>
            <span class="text-slate-400">WS 待连接</span>
        </div>
    </header>

    <main class="hx-index-frame" id="tierContainer">
        <div class="flex flex-col items-center justify-center py-10">
            <div class="hextech-loader-container mb-6">
                <div class="hextech-crystal-loader">
                    <div class="crystal-core"></div>
                    <div class="orbit-ring orbit-1"></div>
                    <div class="orbit-ring orbit-2"></div>
                </div>
            </div>
            <div class="text-hx-accent font-bold tracking-hx uppercase text-sm animate-pulse">加载英雄数据中...</div>
        </div>
    </main>

    <div id="searchOverlay" class="hidden"></div>

    <script type="module" src="/static/js/index.js"></script>
</body>
</html>
